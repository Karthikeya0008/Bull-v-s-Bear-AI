# Listed-peer P/E ratios used for the "P/E vs peers" metric. Edit freely.
# Values are copied from each offer document's "Basis for Offer Price" peer table
# (page numbers refer to that RHP) so they stay traceable. Set exclude: true to keep a peer
# visible but out of the median (e.g. when the document flags it as not comparable).

