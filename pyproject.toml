[project]
name = "bull-vs-bear-ai"
version = "0.1.0"
description = "Agentic RAG debate over Indian IPO offer documents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
